apiVersion: apps/v1
kind: Deployment
metadata:
  name: riot-time-series-store
  namespace: riot
spec:
  replicas: 1
  template:
    metadata:
      labels:
        app: riot-time-series-store
    spec:
      containers:
        - name: riot-time-series-store
          image: riot-time-series-store:local
          imagePullPolicy: IfNotPresent
          env:
            - name: BACKEND_CORE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: BACKEND_CORE_URL
            - name: RABBITMQ_URL
              value: amqp://$(RABBITMQ_USER):$(RABBITMQ_PASS)@rabbitmq:5672/
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: RABBITMQ_PASSWORD
            - name: INFLUX_ORGANIZATION
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: INFLUXDB_INIT_ORG
            - name: INFLUX_BUCKET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: INFLUXDB_INIT_BUCKET
            - name: INFLUX_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: INFLUXDB_URL
            - name: INFLUX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: INFLUXDB_INIT_ADMIN_TOKEN
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
