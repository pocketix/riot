apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: riot-ingress
  namespace: riot
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    # Example TLS settings (uncomment and customize if using cert-manager)
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
    - host: riot.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: riot-frontend-service
                port:
                  number: 80
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: riot-backend-core-service
                port:
                  number: 9090
  # tls:
  #   - hosts:
  #       - riot.example.com
  #     secretName: riot-tls
